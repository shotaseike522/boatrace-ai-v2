name: サイトのスリープ防止（起こしにいく処理）

on:
  workflow_dispatch:
    # GAS (Google Apps Script) の時間主導型トリガーから、8時間おきに呼び出す想定。
    # GitHub Actions自体のscheduleは実行時刻が大きくズレることがあるため、
    # 正確な時刻管理はGAS側に任せ、こちらはGASから呼ばれた時に実行するだけにする。

concurrency:
  group: boatrace-keep-alive
  cancel-in-progress: false

jobs:
  visit-site:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightをセットアップ
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: サイトを実際に開いて起こす
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          import sys
          import time

          URL = "https://boatrace-ai-v2-6avggkgmx7kjuajbe4yxqh.streamlit.app"
          # Streamlit Cloudのスリープ状態からの復帰は数十秒〜数分かかることがあるため、
          # ページを1回開いたらリロードはせずにじっくり待つ(リロードで起床プロセスが
          # 途中リセットされる可能性を避けるため)。休眠中は「Yes, get this app back up!」
          # のような起こすボタンが表示される場合もあるので、見つけたらクリックする。
          MAX_ATTEMPTS = 12
          WAIT_SECONDS = 15

          def find_app_frame(page):
              for f in page.frames:
                  if f != page.main_frame and "/~/+/" in f.url:
                      return f
              return None

          def try_click_wake_button(page):
              candidates = [
                  "text=/get.*app.*back/i",
                  "text=/wake/i",
                  "button:has-text('Yes')",
              ]
              for sel in candidates:
                  try:
                      loc = page.locator(sel).first
                      if loc.is_visible(timeout=1000):
                          loc.click(timeout=3000)
                          print(f"起こすボタンをクリックしました(セレクタ: {sel})")
                          return True
                  except Exception:
                      continue
              return False

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, timeout=60000)

              woke_up = False
              clicked = False
              for attempt in range(1, MAX_ATTEMPTS + 1):
                  time.sleep(WAIT_SECONDS)

                  if not clicked:
                      clicked = try_click_wake_button(page)

                  frame = find_app_frame(page)
                  body_text = ""
                  if frame is not None:
                      try:
                          body_text = frame.inner_text("body", timeout=5000)
                      except Exception:
                          body_text = ""
                  frame_urls = [f.url for f in page.frames]
                  print(f"[試行{attempt}] frame一覧: {frame_urls}")
                  print(f"[試行{attempt}] iframe内テキストの冒頭: {body_text[:80]!r}")
                  if "競艇AI予想" in body_text or "本日のおすすめレース" in body_text:
                      woke_up = True
                      print(f"[試行{attempt}] アプリの起動を確認しました。")
                      break

              browser.close()

              if not woke_up:
                  print("::warning::規定回数の試行内でアプリの起動を確認できませんでした。")
                  sys.exit(1)
          EOF
