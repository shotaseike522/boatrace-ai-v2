name: 競艇AI予想 月次再学習

on:
  schedule:
    # 毎月1日 18:00 UTC (日本時間 毎月2日 3:00) — 日次バッチと重ならない時間帯
    - cron: "0 18 1 * *"
  workflow_dispatch:
    # GitHub画面からの「Run workflow」ボタンによる手動実行用

# 💡 日次バッチ(boatrace-daily-prediction)とは別グループにして、互いを妨げないようにする
concurrency:
  group: boatrace-monthly-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト（LFSファイルも取得）
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 月次再学習（強さモデル3年+jcd・選手スタイル5年・類似レース表3年）
        run: python retrain_monthly.py

      - name: 結果をコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/scenario/
          git commit -m "🤖 月次再学習: 強さモデル・選手スタイル・類似レース表 ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "変更なし（コミットをスキップ）"
          git pull --rebase --autostash origin main
          git push
